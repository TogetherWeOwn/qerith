# cargo-deny policy for the qerith Rust workspace.
#
# Reviewed dependency/security gate, mirrored from velmora's deny.toml at
# c5e79d6 (the pinned engine rev): `cargo deny check` must pass for the
# committed root Cargo.lock and is a required CI job wired fail-closed into
# `ci-ok`. Findings are resolved by updating or replacing the dependency,
# never by weakening this policy to get green.
#
# License inventory: every crates.io crate in the lock comes in through the
# pinned velmora engine (reviewed there) or tokio, all under permissive
# licenses. The only copyleft text is an OR-option next to MIT (`r-efi`,
# used under MIT). Notable single-license crates: `ring` (Apache-2.0 AND
# ISC), `webpki-roots` (CDLA-Permissive-2.0). The only non-crates.io source
# is the reviewed velmora git repo (see [sources]).

[graph]
# The two targets CI ever builds: native tests/lints and the Worker
# deploy target. Deps exclusive to any other target are out of scope.
targets = [
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
# Audit the `worker-transport` graph too, not only the default features:
# the Worker build is a target this workspace ships.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked dependency (e.g. inout 0.2.3, fixed by updating) must fail the
# gate: silently building on yanked code is not acceptable.
yanked = "deny"

[licenses]
# Dev-dependencies ship in no artifact but still enter the tree; check them
# against the same allow list so a disallowed dev-only license fails loudly.
include-dev = true
# Fail-closed allow list: any license not named here rejects the build.
# Copyleft licenses (GPL/AGPL/LGPL-any, SSPL, ...) are deliberately absent.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
# Duplicate versions are common in the workers-rs graph and upgrading them
# in lockstep is follow-up work, so duplicates warn rather than fail.
# New crates with wildcard requirements fail: every version bound must be
# an explicit range.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Every dependency must come from crates.io, except the one reviewed git
# source below. A new git or registry source fails the gate until it is
# reviewed and added here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
# velmora: the shared Usenet engine behind qerith-core (MIT,
# TogetherWeOwn-owned, public). Consumers pin it by immutable git `rev`
# only; the Cargo.lock entries record that exact commit. allow-git cannot
# check the selector, so the cargo-deny CI job also fails any lock git
# source that is not velmora at a full 40-character rev.
allow-git = ["https://github.com/TogetherWeOwn/velmora"]
