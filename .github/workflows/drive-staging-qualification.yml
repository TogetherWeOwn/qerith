name: Drive staging qualification

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Lowercase 40-hex SHA of the dispatch head on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Validate before entering the shared queue: even non-preempting jobs can replace pending jobs.
  source:
    if: github.repository == 'TogetherWeOwn/qerith' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact dispatch source before staging approval
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: timeout --signal=TERM --kill-after=5s 30s node apps/drive/scripts/staging-qualification.mjs

  qualification:
    needs: source
    if: success() && !cancelled() && needs.source.result == 'success' && github.repository == 'TogetherWeOwn/qerith' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: drive-staging-lifecycle
      cancel-in-progress: false
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Verify protected source and staged settings offline
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.QERITH_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          QERITH_S3_ENDPOINT: ${{ secrets.QERITH_S3_ENDPOINT }}
          QERITH_S3_BUCKET: ${{ secrets.QERITH_S3_BUCKET }}
          QERITH_S3_REGION: ${{ secrets.QERITH_S3_REGION }}
          QERITH_S3_STORAGE_EPOCH: ${{ secrets.QERITH_S3_STORAGE_EPOCH }}
          QERITH_S3_ACCESS_KEY_ID: ${{ secrets.QERITH_S3_ACCESS_KEY_ID }}
          QERITH_S3_SECRET_ACCESS_KEY: ${{ secrets.QERITH_S3_SECRET_ACCESS_KEY }}
        run: timeout --signal=TERM --kill-after=5s 30s node apps/drive/scripts/staging-qualification-settings.mjs
      - name: Build exact qualification source
        working-directory: apps/drive
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD -- .
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
          test "$(npm --version)" = 11.19.0
          test "$(npm config get min-release-age)" = 3
          test "$(npm config get ignore-scripts)" = true
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s .svelte-kit/cloudflare/_worker.js
          test -d .svelte-kit/cloudflare/_app/immutable
          git diff --quiet HEAD -- .
      - name: Fail closed until the live runner and cleanup are reviewed
        run: |
          printf '%s\n' 'Full-v0 staging qualification is not wired; no receipt can be issued.' >&2
          exit 1
