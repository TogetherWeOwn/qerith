name: ci

# `ci-ok` is the aggregate check meant to be required on main: its NAME must
# stay `ci-ok`, and every gating job id must be listed in its `needs`.
# Patterns (pinned actions, cache policy, pinned cargo-deny, fail-closed
# aggregate) are mirrored from velmora's ci.yml at the pinned engine rev.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: every required check must report on the queue's
  # temporary merge commit. merge_group runs are never cancelled.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # merge_group refs are per-queue-entry and must run to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: rust test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QERITH_SERVICE_EVIDENCE_DIR: /tmp/qerith-product-service-evidence
      QERITH_EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable
      # rust-cache policy: PR and merge-queue runs restore main's cache but
      # only main saves, so per-PR copies do not evict main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Includes the pinned-engine smoke test (NZB parse, NNTP fetch against
      # velmora-test-nntp, yEnc round trip).
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p qerith-core --features archive-provider --all-targets -- -D warnings
      - run: cargo test --locked -p qerith-core --features archive-provider
      - name: Require positive and negative service evidence
        run: |
          test -s "$QERITH_SERVICE_EVIDENCE_DIR/service-positive.json"
          test -s "$QERITH_SERVICE_EVIDENCE_DIR/service-negative.json"
          test -s "$QERITH_SERVICE_EVIDENCE_DIR/service-revocation.json"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$QERITH_EVIDENCE_HEAD"
          printf '%s\n' "$tested_sha" > "$QERITH_SERVICE_EVIDENCE_DIR/tested-sha.txt"
          printf '%s\n' "$QERITH_EVIDENCE_HEAD" > "$QERITH_SERVICE_EVIDENCE_DIR/head-sha.txt"
      - name: Upload reference-service invariant evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-service-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.QERITH_SERVICE_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 7

  rust-wasm:
    name: rust check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scalar core (no transport features) and the Workers transport build.
      - run: cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features archive-provider
      - run: cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features worker-transport
      - run: cargo clippy --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features worker-transport -- -D warnings
      # The engine's simd128 yEnc fast path must keep compiling through this
      # crate (Workers run V8 with Wasm SIMD).
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features worker-transport

  # MSRV gate: `rust-version` in crates/qerith-core/Cargo.toml must build the
  # locked dependency graph. Bump both together when the lockfile needs a
  # newer toolchain.
  rust-msrv:
    name: rust check (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust 1.89 (qerith-core rust-version)
        run: |
          rustup toolchain install 1.89 --profile minimal --no-self-update
          rustup default 1.89
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p qerith-core
      - run: cargo check --locked -p qerith-core --no-default-features
      - run: cargo check --locked -p qerith-core --no-default-features --features archive-provider

  # Dependency/security gate: the reviewed deny.toml policy must pass for
  # the committed lockfile. Findings are fixed by updating the dependency,
  # never by weakening the policy. Keep this job id in ci-ok's needs.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install pinned cargo-deny 0.20.2
        run: |
          set -euo pipefail
          deny_version="0.20.2"
          asset="cargo-deny-${deny_version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${deny_version}"
          # Pinned digest recorded in-repo so a replaced release artifact
          # fails closed instead of executing. Re-pin deliberately when the
          # version above changes, verifying the digest out-of-band first.
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 \
            -o "/tmp/${asset}" "${base}/${asset}"
          echo "${expected_sha256}  /tmp/${asset}" | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 755 "/tmp/cargo-deny-${deny_version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version
      # Fail-closed freshness: the committed lockfile must match the
      # manifests, or the audit below would check a stale dependency set.
      - name: Prove the committed lockfile is fresh
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Pin policy: allow-git admits velmora by URL only, so a `branch`,
      # `tag` or bare git selector would still pass the audit. Read the
      # sources from Cargo's own resolve (all features, locked) rather than
      # grepping Cargo.lock, so lockfile formatting cannot hide an entry:
      # every git source must be velmora at a full 40-character `rev` that
      # equals the resolved commit.
      - name: Prove every git dependency is pinned by immutable rev
        run: |
          set -euo pipefail
          re='^git\+https://github\.com/TogetherWeOwn/velmora\?rev=([0-9a-f]{40})#([0-9a-f]{40})$'
          sources=$(cargo metadata --locked --all-features --format-version 1 \
            | jq -r '.packages[] | .source // empty | select(startswith("git+"))')
          count=0
          fail=0
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            count=$((count + 1))
            if [[ "$src" =~ $re ]] && [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then
              continue
            fi
            echo "pin check: not pinned by a full immutable velmora rev: $src"
            fail=1
          done <<< "$sources"
          if [ "$count" -eq 0 ]; then
            echo "pin check: no velmora git source in the resolve"
            exit 1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "pin check: ${count} velmora git package(s) pinned by full rev"
      - name: Audit advisories, bans, licenses, sources
        run: cargo-deny --manifest-path Cargo.toml check

  ci-ok:
    name: ci-ok
    needs: [rust-test, rust-wasm, rust-msrv, cargo-deny]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON" > /dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
