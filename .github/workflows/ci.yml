name: Drive lock resolution (data only)

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Reviewed full workflow commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Admit reviewed workflow source and authorization window
        shell: bash
        env:
          REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_WORKFLOW_SHA" = "$ACTUAL_WORKFLOW_SHA"
          ceiling=$(date -u -d '2026-11-18T03:07:46Z' +%s)
          test "$(date -u +%s)" -le "$((ceiling - 600))"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0dc04a34f7aa84ee358468001f2cd1515d1b23d7
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Resolve lock metadata without installing packages
        working-directory: apps/drive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0dc04a34f7aa84ee358468001f2cd1515d1b23d7
          for file in package.json package-lock.json .npmrc; do
            test -f "$file" && test ! -L "$file"
          done
          printf '%s  %s\n' \
            2603969c3664d360723e671ee8a9f851e8e1d41cf5bcd68c0f378a9d08e77961 package.json \
            a24dec5e5d8b66ff9e56e2b028d00e2cb1dab33be0b0a6c5e5d255787fc72bc6 package-lock.json \
            25140450bba6a28b73d29e13b56103a5425b6bfebbb03771152602edd3c928f2 .npmrc | sha256sum -c -
          for path in npm-shrinkwrap.json node_modules ../node_modules ../../node_modules ../.npmrc ../../.npmrc ../package.json ../../package.json; do
            test ! -e "$path" && test ! -L "$path"
          done
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          private="$(mktemp -d "$RUNNER_TEMP/drive-resolve.XXXXXXXX")"
          trap 'rm -rf -- "$private"' EXIT
          mkdir -p "$private/home" "$private/cache" "$RUNNER_TEMP/drive-lock-output"
          clean_npm() {
            env -i PATH="$PATH" HOME="$private/home" \
              npm_config_userconfig="$private/home/.npmrc" \
              npm_config_globalconfig="$private/home/global.npmrc" \
              npm_config_cache="$private/cache" "$@"
          }
          test "$(clean_npm npm config get min-release-age)" = 3
          test "$(clean_npm npm config get ignore-scripts)" = true
          ceiling=$(date -u -d '2026-11-18T03:07:46Z' +%s)
          test "$(date -u +%s)" -le "$((ceiling - 310))"
          clean_npm timeout --signal=TERM --kill-after=10s 300s \
            npm install --package-lock-only --ignore-scripts --save-exact \
              --no-audit --no-fund --registry=https://registry.npmjs.org/ \
              @simplewebauthn/server@14.1.0
          test "$(date -u +%s)" -lt "$ceiling"
          for path in node_modules ../node_modules ../../node_modules; do
            test ! -e "$path" && test ! -L "$path"
          done
          cp package.json package-lock.json "$RUNNER_TEMP/drive-lock-output/"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/drive-lock-output/sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drive-lock-resolution-${{ github.run_id }}
          path: ${{ runner.temp }}/drive-lock-output/
          if-no-files-found: error
          retention-days: 7
