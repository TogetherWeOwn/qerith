name: ci

# `ci-ok` is the aggregate check meant to be required on main: its NAME must
# stay `ci-ok`, and every gating job id must be listed in its `needs`.
# Patterns (pinned actions, cache policy, pinned cargo-deny, fail-closed
# aggregate) are mirrored from velmora's ci.yml at the pinned engine rev.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue validation: every required check must report on the queue's
  # temporary merge commit. merge_group runs are never cancelled.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # merge_group refs are per-queue-entry and must run to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: rust test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QERITH_SERVICE_EVIDENCE_DIR: /tmp/qerith-product-service-evidence
      QERITH_EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable
      # rust-cache policy: PR and merge-queue runs restore main's cache but
      # only main saves, so per-PR copies do not evict main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Includes the pinned-engine smoke test (NZB parse, NNTP fetch against
      # velmora-test-nntp, yEnc round trip).
      - run: cargo test --locked --workspace
      - name: Require positive and negative service evidence
        run: |
          test -s "$QERITH_SERVICE_EVIDENCE_DIR/service-positive.json"
          test -s "$QERITH_SERVICE_EVIDENCE_DIR/service-negative.json"
          test -s "$QERITH_SERVICE_EVIDENCE_DIR/service-revocation.json"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$QERITH_EVIDENCE_HEAD"
          printf '%s\n' "$tested_sha" > "$QERITH_SERVICE_EVIDENCE_DIR/tested-sha.txt"
          printf '%s\n' "$QERITH_EVIDENCE_HEAD" > "$QERITH_SERVICE_EVIDENCE_DIR/head-sha.txt"
      - name: Upload reference-service invariant evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-service-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.QERITH_SERVICE_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 7

  rust-wasm:
    name: rust check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scalar core (no transport features) and the Workers transport build.
      - run: cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features worker-transport
      - run: cargo clippy --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features worker-transport -- -D warnings
      # The engine's simd128 yEnc fast path must keep compiling through this
      # crate (Workers run V8 with Wasm SIMD).
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo check --locked -p qerith-core --target wasm32-unknown-unknown --no-default-features --features worker-transport

  # MSRV gate: `rust-version` in crates/qerith-core/Cargo.toml must build the
  # locked dependency graph. Bump both together when the lockfile needs a
  # newer toolchain.
  rust-msrv:
    name: rust check (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust 1.89 (qerith-core rust-version)
        run: |
          rustup toolchain install 1.89 --profile minimal --no-self-update
          rustup default 1.89
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p qerith-core
      - run: cargo check --locked -p qerith-core --no-default-features

  # Dependency/security gate: the reviewed deny.toml policy must pass for
  # the committed lockfile. Findings are fixed by updating the dependency,
  # never by weakening the policy. Keep this job id in ci-ok's needs.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install pinned cargo-deny 0.20.2
        run: |
          set -euo pipefail
          deny_version="0.20.2"
          asset="cargo-deny-${deny_version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${deny_version}"
          # Pinned digest recorded in-repo so a replaced release artifact
          # fails closed instead of executing. Re-pin deliberately when the
          # version above changes, verifying the digest out-of-band first.
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 \
            -o "/tmp/${asset}" "${base}/${asset}"
          echo "${expected_sha256}  /tmp/${asset}" | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 755 "/tmp/cargo-deny-${deny_version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version
      # Fail-closed freshness: the committed lockfile must match the
      # manifests, or the audit below would check a stale dependency set.
      - name: Prove the committed lockfile is fresh
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Pin policy: allow-git admits velmora by URL only, so a `branch`,
      # `tag` or bare git selector would still pass the audit. Read the
      # sources from Cargo's own resolve (all features, locked) rather than
      # grepping Cargo.lock, so lockfile formatting cannot hide an entry:
      # every git source must be velmora at a full 40-character `rev` that
      # equals the resolved commit.
      - name: Prove every git dependency is pinned by immutable rev
        run: |
          set -euo pipefail
          re='^git\+https://github\.com/TogetherWeOwn/velmora\?rev=([0-9a-f]{40})#([0-9a-f]{40})$'
          sources=$(cargo metadata --locked --all-features --format-version 1 \
            | jq -r '.packages[] | .source // empty | select(startswith("git+"))')
          count=0
          fail=0
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            count=$((count + 1))
            if [[ "$src" =~ $re ]] && [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then
              continue
            fi
            echo "pin check: not pinned by a full immutable velmora rev: $src"
            fail=1
          done <<< "$sources"
          if [ "$count" -eq 0 ]; then
            echo "pin check: no velmora git source in the resolve"
            exit 1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "pin check: ${count} velmora git package(s) pinned by full rev"
      - name: Verify advisory exception expiry guard
        run: |
          python3 -m unittest discover -s scripts -p test_advisory_expiry.py
          python3 scripts/check_advisory_expiry.py
      - name: Audit advisories, bans, licenses, sources
        run: cargo-deny --manifest-path Cargo.toml check

  archive-clients:
    name: pinned archive clients (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QERITH_EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QERITH_CLIENT_RUNNER: ${{ github.workspace }}/scripts/archive-clients/runner.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12.8"
      - name: Initialize fail-closed evidence for this exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QERITH_EVIDENCE_HEAD"
          # runner context is unavailable in job-level env; bind these at runtime.
          export QERITH_CLIENT_EVIDENCE_DIR="$RUNNER_TEMP/archive-client-evidence"
          export QERITH_CLIENT_PRIVATE_DIR="$RUNNER_TEMP/archive-client-private-$GITHUB_RUN_ID"
          printf 'QERITH_CLIENT_EVIDENCE_DIR=%s\n' "$QERITH_CLIENT_EVIDENCE_DIR" >> "$GITHUB_ENV"
          printf 'QERITH_CLIENT_PRIVATE_DIR=%s\n' "$QERITH_CLIENT_PRIVATE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$QERITH_CLIENT_EVIDENCE_DIR"
          python3 -I - <<'PY'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path('scripts/archive-clients').resolve()))
          import runner
          runner.initial_manifest(pathlib.Path(__import__('os').environ['QERITH_CLIENT_EVIDENCE_DIR']))
          PY
      - name: Install pinned wheel-only clients and throwaway TLS fixture material
        run: timeout --signal=TERM --kill-after=10s 300s bash scripts/archive-clients/setup-actions.sh
      - name: Test relay preservation, bounds, cleanup and manifest failure cases
        run: timeout --signal=TERM --kill-after=10s 90s python3 -I -m unittest discover -s scripts/archive-clients -p 'test_*.py' -v
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the parent-owned archive integration fixture
        run: timeout --signal=TERM --kill-after=10s 900s cargo test --locked -p qerith-core --test archive_clients --no-run
      - name: Exercise pinned low-level clients through synthetic cold restore
        run: |
          set -euo pipefail
          # Rust owns its fixture process lifetime; Python owns a bounded process
          # group per client/profile. The outer deadline also handles fixture hangs.
          ulimit -f 131072
          timeout --signal=TERM --kill-after=10s 600s cargo test --locked -p qerith-core --test archive_clients -- --ignored --nocapture
      - name: Finalize trace hashes after fixture exit and validate qualification
        if: ${{ always() }}
        run: |
          python3 -I - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('scripts/archive-clients').resolve()))
          import runner
          assert runner.finalize_manifest(pathlib.Path(os.environ['QERITH_CLIENT_EVIDENCE_DIR']),
                                          os.environ['QERITH_EVIDENCE_HEAD']), 'qualification incomplete or failed'
          PY
      - name: Upload bounded qualification evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-clients-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.QERITH_CLIENT_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove private keys and client installations on success, failure or cancellation
        if: ${{ always() }}
        run: |
          set -euo pipefail
          case "$QERITH_CLIENT_PRIVATE_DIR" in
            "$RUNNER_TEMP"/archive-client-private-*)
              if [ -d "$QERITH_CLIENT_PRIVATE_DIR" ]; then
                ls -ld -- "$QERITH_CLIENT_PRIVATE_DIR"
                rm -rf -- "$QERITH_CLIENT_PRIVATE_DIR"
              fi
              test ! -e "$QERITH_CLIENT_PRIVATE_DIR"
              ;;
            *) exit 1 ;;
          esac

  d1-test:
    name: workers D1 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies without lifecycle scripts
        working-directory: apps/drive-test
        run: |
          test "$(npm --version)" = '11.19.0'
          npm ci --ignore-scripts
      - name: Prepare Drive project configuration for shared metadata source
        working-directory: apps/drive
        run: |
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Run local D1 smoke test
        working-directory: apps/drive-test
        run: npm test

  pr-mutation:
    name: PR test mutations
    # Keep the check separate from ci-ok during rollout.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Report PR-only scope on main
        if: github.event_name == 'push'
        run: echo 'Mutation execution requires a pull request diff.'
      # Compare the integration snapshot against its exact base parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          node-version: '24.21.0'
      - name: Check new surviving mutants and prove the ratchet
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          plan=$(node scripts/pr-mutation.mjs plan "$PWD" "$PR_BASE" "$PR_HEAD" "$GITHUB_SHA" "$BASE_BRANCH")
          read -r base targets workers drive proof <<< "$plan"
          printf 'Comparing base %s to integration %s for PR head %s\n' "$base" "$GITHUB_SHA" "$PR_HEAD"
          if [[ "$targets" == 0 && "$proof" == 0 ]]; then
            echo 'Mutation pass: 0 target(s), 0 new survivor(s)'
            exit 0
          fi

          export MUTATION_HEAD="$RUNNER_TEMP/mutation-head"
          baseline="$RUNNER_TEMP/mutation-base"
          git worktree add --detach "$MUTATION_HEAD" "$GITHUB_SHA"
          git worktree add --detach "$baseline" "$base"
          test "$(npm --version)" = '11.19.0'

          install_locked() {
            bash apps/drive/scripts/reject-shrinkwrap.sh "$1"
            node --input-type=module - "$1/package-lock.json" <<'JS'
          import { readFileSync } from 'node:fs';
          import { verifyLock } from './apps/drive/scripts/verify-lock-age.mjs';
          await verifyLock(JSON.parse(readFileSync(process.argv[2], 'utf8')), async name => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {
              signal: AbortSignal.timeout(10000), redirect: 'error',
            });
            if (!response.ok) throw new Error(`Registry metadata unavailable: ${name}`);
            return response.json();
          });
          JS
            npm ci --ignore-scripts --no-audit --no-fund --prefix "$1"
          }
          install_locked "$MUTATION_HEAD/apps/drive"
          if [[ "$drive" == 1 ]]; then
            install_locked "$baseline/apps/drive"
            (cd "$MUTATION_HEAD/apps/drive" && node node_modules/@sveltejs/kit/svelte-kit.js sync)
            (cd "$baseline/apps/drive" && node node_modules/@sveltejs/kit/svelte-kit.js sync)
          fi
          if [[ "$workers" == 1 || "$proof" == 1 ]]; then
            install_locked "$MUTATION_HEAD/apps/drive-test"
          fi
          if [[ "$workers" == 1 ]]; then
            install_locked "$baseline/apps/drive-test"
          fi
          if [[ "$proof" == 1 ]]; then
            MUTATION_PROOF=1 node --test scripts/pr-mutation.test.mjs
          fi
          node scripts/pr-mutation.mjs run "$MUTATION_HEAD" "$base" "$GITHUB_SHA" "$baseline"

  sealed-output-reader:
    name: sealed output reader
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: timeout --signal=TERM --kill-after=10s 60s python3 -I -m unittest discover -s scripts/screen-reader -p 'test_sealed_output.py' -v
      - name: Test Debian metadata primitives
        run: |
          timeout --signal=TERM --kill-after=10s 60s python3 -I -c 'import sys, unittest; suite = unittest.defaultTestLoader.discover("scripts/screen-reader", pattern="test_debian_metadata.py"); assert suite.countTestCases() >= 4; sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())'
      - name: Test pinned Debian signature status validation
        run: |
          timeout --signal=TERM --kill-after=10s 60s python3 -I -c 'import sys, unittest; suite = unittest.defaultTestLoader.discover("scripts/screen-reader", pattern="test_debian_signatures.py"); assert suite.countTestCases() >= 2; sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())'
      - name: Test authenticated Debian archive and ELF helpers
        run: |
          timeout --signal=TERM --kill-after=10s 60s python3 -I -c 'import sys, unittest; suite = unittest.defaultTestLoader.discover("scripts/screen-reader", pattern="test_debian_archive.py"); assert suite.countTestCases() >= 4; sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())'

  drive-lock-verifier:
    name: drive lock verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: timeout --signal=TERM --kill-after=10s 60s node --test apps/drive/tests/lock-age.test.mjs
      - name: Test staging preparation metadata
        run: timeout --signal=TERM --kill-after=10s 60s node --test apps/drive/scripts/staging-manifest.test.mjs
      - name: Test staging publish orchestration
        if: hashFiles('apps/drive/scripts/staging-publish.test.mjs') != ''
        run: timeout --signal=TERM --kill-after=10s 60s node --test apps/drive/scripts/staging-publish.test.mjs
      - name: Test staging migration workflow
        if: hashFiles('apps/drive/scripts/staging-migration-workflow.test.mjs') != ''
        run: timeout --signal=TERM --kill-after=10s 60s node --test apps/drive/scripts/staging-migration-workflow.test.mjs
      - name: Test migration source ledger
        if: hashFiles('apps/drive/scripts/staging-migrations.test.mjs') != ''
        run: timeout --signal=TERM --kill-after=10s 60s node --test apps/drive/scripts/staging-migrations.test.mjs
      # An exact PR head can predate the guard even when the merge ref has this CI step.
      - name: Test staging source guard
        if: hashFiles('.github/workflows/drive-staging-preparation.yml', 'apps/drive/scripts/staging-source.test.mjs') != ''
        run: timeout --signal=TERM --kill-after=10s 60s node --test apps/drive/scripts/staging-source.test.mjs
      - name: Test offline bundle validation
        run: timeout --signal=TERM --kill-after=10s 60s python3 -I -m unittest discover -s scripts/screen-reader -p 'test_bundle_*.py' -v

  bundle-acquisition:
    name: offline bundle acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Acquire and verify pinned bytes
        run: |
          set -euo pipefail
          python3 -I scripts/screen-reader/bundle_bytes.py acquire apps/drive/package-lock.json "$RUNNER_TEMP/bundle"
          python3 -I scripts/screen-reader/bundle_bytes.py verify apps/drive/package-lock.json "$RUNNER_TEMP/bundle"
      - name: Install from verified bytes without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/consume"
          cd "$RUNNER_TEMP/consume"
          python3 -I "$GITHUB_WORKSPACE/scripts/screen-reader/bundle_bytes.py" verify "$GITHUB_WORKSPACE/apps/drive/package-lock.json" "$RUNNER_TEMP/bundle"
          mkdir tool cache project
          tar -xJf "$RUNNER_TEMP/bundle/node-v24.21.0-linux-x64.tar.xz" -C tool
          export PATH="$PWD/tool/node-v24.21.0-linux-x64/bin:$PATH"
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          for artifact in "$RUNNER_TEMP/bundle"/*.tgz; do
            npm cache add "$artifact" --offline --ignore-scripts --cache "$PWD/cache"
          done
          cp "$GITHUB_WORKSPACE/apps/drive/package.json" "$GITHUB_WORKSPACE/apps/drive/package-lock.json" project/
          NODE_ENV=production npm_config_omit=optional npm ci --prefix project --offline --ignore-scripts --include=dev --include=optional --no-audit --no-fund --min-release-age=3 --cache "$PWD/cache"
          test -f project/node_modules/vite/package.json
          test -f project/node_modules/svelte/package.json
          test -f project/node_modules/@esbuild/linux-x64/bin/esbuild
          test -f project/node_modules/@rolldown/binding-linux-x64-gnu/rolldown-binding.linux-x64-gnu.node
          cmp "$GITHUB_WORKSPACE/apps/drive/package-lock.json" project/package-lock.json

  drive-bootstrap:
    name: drive dependency bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/drive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Test alternate lockfile guard
        run: bash tests/reject-shrinkwrap.test.sh
      - name: Verify locked release ages and integrity
        run: |
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
      - name: Install reviewed lock without scripts
        run: |
          test "$(npm --version)" = 11.19.0
          test "$(npm config get min-release-age)" = 3
          test "$(npm config get ignore-scripts)" = true
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve private qualification migrations with pinned Wrangler locally
        # Older PR checkouts may have the unit tests but predate this integration check.
        if: hashFiles('apps/drive/scripts/test-qualification-wrangler.sh') != ''
        run: bash scripts/test-qualification-wrangler.sh
      - name: Test all staging qualification adapters and policy offline
        if: hashFiles('.github/workflows/drive-staging-qualification.yml', 'apps/drive/scripts/staging-qualification*.test.mjs') != ''
        run: |
          if [[ -f ../../.github/workflows/drive-staging-qualification.yml ]]; then
            test -f scripts/staging-qualification.test.mjs
          fi
          timeout --signal=TERM --kill-after=10s 120s node --import tsx --test 'scripts/staging-qualification*.test.mjs'
      - name: Check Drive project types and configuration coverage
        run: |
          npm run check
          node --test tests/typecheck.test.mjs
      - name: Reject Node globals in application source
        run: |
          set -euo pipefail
          fixture=src/__node_global_check__.ts
          test ! -e "$fixture"
          trap 'rm -f "$fixture"' EXIT
          printf '%s\n' "export const invalid = Buffer.from('browser');" > "$fixture"
          if npx --no-install svelte-check --tsconfig ./tsconfig.json > "$RUNNER_TEMP/app-global-check.log" 2>&1; then
            echo 'Application check unexpectedly accepted Buffer'
            exit 1
          fi
          cat "$RUNNER_TEMP/app-global-check.log"
          grep -F "Cannot find name 'Buffer'" "$RUNNER_TEMP/app-global-check.log"
      - name: Test strict XML parsing
        run: node --import tsx --test tests/xml-parser.test.ts
      - name: Test fail-closed Worker entrypoint
        run: node --import tsx --test tests/worker.test.ts
      - name: Check types
        run: npm run check
      - name: Test
        run: npm test
      - name: Build and validate Workers bundle
        run: |
          npm run build
          git diff --exit-code -- src/worker.ts
          test ! -e .svelte-kit/adapter-wrangler.json
          test -s .svelte-kit/cloudflare/_worker.js
          npx --no-install wrangler deploy .svelte-kit/cloudflare/_worker.js --config wrangler.build.jsonc --dry-run --outdir "$RUNNER_TEMP/drive-app"
          npx --no-install wrangler deploy .svelte-kit/cloudflare/_worker.js --config wrangler.staging.json --dry-run --outdir "$RUNNER_TEMP/drive-staging"
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/drive-worker"
      - name: Exercise Workers runtime
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/runtime-smoke.mjs

  drive-browser-capture:
    name: drive browser fixture capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.browser-upload.outputs.artifact-id }}
      policy: ${{ steps.browser-source.outputs.policy }}
    env:
      REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SNAPSHOT_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: tested
    steps:
      - &browser-integration
        name: Check out the immutable integration snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: integration
          fetch-depth: 0
          persist-credentials: false
      - &browser-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - &browser-source
        name: Select the browser checkout and trusted main policy
        id: browser-source
        working-directory: integration
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          case "$GITHUB_EVENT_NAME" in
            pull_request) policy="$(git rev-parse "$SNAPSHOT_SHA^1")" ;;
            merge_group)
              [[ "$MERGE_GROUP_BASE" =~ ^[a-f0-9]{40}$ ]]
              git merge-base --is-ancestor "$MERGE_GROUP_BASE" "$SNAPSHOT_SHA"
              policy="${VERIFIED_BROWSER_POLICY:-$(git merge-base "$MERGE_GROUP_BASE" origin/main)}"
              git merge-base --is-ancestor "$policy" "$MERGE_GROUP_BASE"
              ;;
            workflow_dispatch)
              policy="${VERIFIED_BROWSER_POLICY:-$(git merge-base "$SNAPSHOT_SHA" origin/main)}"
              git merge-base --is-ancestor "$policy" "$SNAPSHOT_SHA"
              ;;
            *) policy="$SNAPSHOT_SHA" ;;
          esac
          [[ "$policy" =~ ^[a-f0-9]{40}$ ]]
          if [[ -v VERIFIED_BROWSER_POLICY ]]; then
            test "$policy" = "$VERIFIED_BROWSER_POLICY"
          fi
          git merge-base --is-ancestor "$policy" origin/main
          git show "$policy:scripts/select-browser-checkout.mjs" > "$RUNNER_TEMP/select-browser-checkout.mjs"
          node "$RUNNER_TEMP/select-browser-checkout.mjs" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
      - name: Test browser provenance and evidence fixtures
        working-directory: integration
        run: node --test scripts/browser-ci.test.mjs
      - name: Check out the selected browser source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.browser-source.outputs.tested }}
          path: tested
          persist-credentials: false
      - name: Assert the actual tested checkout
        env:
          TESTED_SHA: ${{ steps.browser-source.outputs.tested }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Verify Drive lock release ages and integrity
        working-directory: tested/apps/drive
        run: |
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
      - name: Verify browser lock release ages and integrity
        working-directory: tested/apps/drive/browser
        run: |
          bash ../scripts/reject-shrinkwrap.sh .
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { verifyLock } from '../scripts/verify-lock-age.mjs';
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          await verifyLock(lock, async name => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, { signal: AbortSignal.timeout(10000), redirect: 'error' });
            if (!response.ok) throw new Error(`Registry metadata unavailable: ${name}`);
            return response.json();
          });
          JS
      - name: Install locked dependencies without lifecycle scripts
        run: |
          test "$(npm --version)" = 11.19.0
          npm ci --ignore-scripts --no-audit --no-fund --prefix apps/drive
          npm ci --ignore-scripts --no-audit --no-fund --prefix apps/drive/browser
      - name: Install pinned Chromium on the runner
        working-directory: tested/apps/drive/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Load the browser scheduler
        working-directory: integration
        env:
          BROWSER_POLICY_SHA: ${{ steps.browser-source.outputs.policy }}
        run: |
          set -euo pipefail
          source="$BROWSER_POLICY_SHA"
          if ! git cat-file -e "$source:scripts/browser-job.mjs"; then source="$SNAPSHOT_SHA"; fi
          mkdir "$RUNNER_TEMP/browser-policy"
          git archive "$source" scripts/browser-job.mjs scripts/browser-registry.mjs scripts/browser-evidence.mjs apps/drive/browser/scenarios.json |
            tar -x -C "$RUNNER_TEMP/browser-policy"
      - name: Exercise fixture and require complete evidence
        env:
          DRIVE_BROWSER_HEAD: ${{ steps.browser-source.outputs.tested }}
          DRIVE_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/drive-browser-evidence
          BROWSER_GIT_DIR: ${{ github.workspace }}/integration
          TESTED_SHA: ${{ steps.browser-source.outputs.tested }}
        run: |
          set -euo pipefail
          DRIVE_BROWSER_ISOLATED="$(node "$RUNNER_TEMP/browser-policy/scripts/browser-job.mjs" isolated)"
          export DRIVE_BROWSER_ISOLATED
          git diff --exit-code
          git diff --cached --exit-code
          npm test --prefix apps/drive/browser
          git diff --exit-code
          git diff --cached --exit-code
      - name: Exercise registered generated fixtures in Chromium with local D1
        if: steps.browser-source.outputs.tested == env.REQUESTED_HEAD
        env:
          BROWSER_GIT_DIR: ${{ github.workspace }}/integration
          BROWSER_TESTED_DIR: ${{ github.workspace }}/tested
          TESTED_SHA: ${{ steps.browser-source.outputs.tested }}
          EVIDENCE_DIR: ${{ runner.temp }}/drive-browser-evidence
        run: |
          set -euo pipefail
          npm run build --prefix apps/drive
          node "$RUNNER_TEMP/browser-policy/scripts/browser-job.mjs" capture
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: browser-upload
        with:
          name: drive-browser-capture
          path: ${{ runner.temp }}/drive-browser-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  drive-browser:
    name: drive browser fixture evidence
    needs: drive-browser-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.browser-upload.outputs.artifact-id }}
      policy: ${{ steps.browser-source.outputs.policy }}
    env:
      REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SNAPSHOT_SHA: ${{ github.sha }}
      VERIFIED_BROWSER_POLICY: ${{ needs.drive-browser-capture.outputs.policy }}
    steps:
      - *browser-integration
      - *browser-node
      - *browser-source
      - name: Require the upstream evidence artifact
        env:
          ARTIFACT_ID: ${{ needs.drive-browser-capture.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.drive-browser-capture.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/drive-browser-evidence
      - name: Verify evidence and record both provenance identities
        working-directory: integration
        env: &browser-verification
          BROWSER_GIT_DIR: ${{ github.workspace }}/integration
          BROWSER_POLICY_SHA: ${{ steps.browser-source.outputs.policy }}
          EVIDENCE_DIR: ${{ runner.temp }}/drive-browser-evidence
          TESTED_SHA: ${{ steps.browser-source.outputs.tested }}
          COMPATIBILITY_MODE: ${{ steps.browser-source.outputs.mode }}
          SNAPSHOT_BASE: ${{ steps.browser-source.outputs.snapshot_base }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BROWSER_POLICY_SHA:scripts/browser-job.mjs"; then
            mkdir "$RUNNER_TEMP/browser-policy"
            git archive "$BROWSER_POLICY_SHA" scripts/browser-job.mjs scripts/browser-registry.mjs scripts/browser-evidence.mjs apps/drive/browser/scenarios.json |
              tar -x -C "$RUNNER_TEMP/browser-policy"
            node "$RUNNER_TEMP/browser-policy/scripts/browser-job.mjs" baseline
          else
            # Preserve the preceding main snapshot's checks during the registry rollout.
            has_file() { if git cat-file -e "$TESTED_SHA:$1"; then echo true; else echo false; fi; }
            has_exact_file() {
              if [[ "$TESTED_SHA" == "$REQUESTED_HEAD" ]]; then has_file "$1"; else echo false; fi
            }
            browser=apps/drive/browser
            ROOT_EVIDENCE="$(has_exact_file apps/drive/src/lib/RootListingView.svelte)"
            export ROOT_EVIDENCE
            UPLOAD_EVIDENCE="$(has_exact_file apps/drive/src/routes/api/root-listing/+server.ts)"
            export UPLOAD_EVIDENCE
            ROOT_SHARE_EVIDENCE="$(has_exact_file "$browser/root-share.mjs")"
            export ROOT_SHARE_EVIDENCE
            NESTED_SHARE_EVIDENCE="$(has_exact_file "$browser/nested-share.mjs")"
            export NESTED_SHARE_EVIDENCE
            STAGING_EVIDENCE="$(has_exact_file "$browser/staging-root.mjs")"
            export STAGING_EVIDENCE
            STAGING_SHARED_EVIDENCE="$(has_exact_file "$browser/shared-listing.mjs")"
            export STAGING_SHARED_EVIDENCE
            STAGING_FOLDER_EVIDENCE="$(has_exact_file apps/drive/tests/staging-folder-worker-fixture.mjs)"
            export STAGING_FOLDER_EVIDENCE
            CONTINUATION_EVIDENCE="$(has_file "$browser/root-upload-continuation.mjs")"
            export CONTINUATION_EVIDENCE
            DELETE_FILE_EVIDENCE="$(has_file "$browser/delete-file.mjs")"
            export DELETE_FILE_EVIDENCE
            SHARE_RECIPIENT_EVIDENCE="$(has_file "$browser/share-recipient.mjs")"
            export SHARE_RECIPIENT_EVIDENCE
            git show "$BROWSER_POLICY_SHA:scripts/browser-evidence.mjs" > "$RUNNER_TEMP/browser-evidence.mjs"
            node "$RUNNER_TEMP/browser-evidence.mjs"
            jq --arg policy "$BROWSER_POLICY_SHA" '. + {policy: $policy}' "$EVIDENCE_DIR/provenance.json" > "$RUNNER_TEMP/provenance.json"
            mv "$RUNNER_TEMP/provenance.json" "$EVIDENCE_DIR/provenance.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: browser-upload
        with:
          name: drive-browser-${{ env.REQUESTED_HEAD }}
          path: ${{ runner.temp }}/drive-browser-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  drive-browser-coverage:
    name: drive browser registry coverage
    needs: drive-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SNAPSHOT_SHA: ${{ github.sha }}
      VERIFIED_BROWSER_POLICY: ${{ needs.drive-browser.outputs.policy }}
    steps:
      - *browser-integration
      - *browser-node
      - *browser-source
      - name: Require the upstream evidence artifact
        env:
          ARTIFACT_ID: ${{ needs.drive-browser.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.drive-browser.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/drive-browser-evidence
      - name: Require registered sources and complete claimed evidence
        working-directory: integration
        env: *browser-verification
        run: |
          set -euo pipefail
          # During the first rollout, run the proposed gate after main's original checks.
          source="$BROWSER_POLICY_SHA"
          if ! git cat-file -e "$source:scripts/browser-job.mjs"; then source="$SNAPSHOT_SHA"; fi
          mkdir "$RUNNER_TEMP/browser-policy"
          git archive "$source" scripts/browser-job.mjs scripts/browser-registry.mjs scripts/browser-evidence.mjs apps/drive/browser/scenarios.json |
            tar -x -C "$RUNNER_TEMP/browser-policy"
          node "$RUNNER_TEMP/browser-policy/scripts/browser-job.mjs" coverage

  drive-release-preflight:
    name: Drive release preflight (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -IB -m unittest discover -s scripts/drive-release -p test_preflight.py -v

  ci-ok:
    name: ci-ok
    needs: [rust-test, rust-wasm, rust-msrv, cargo-deny, archive-clients, d1-test, sealed-output-reader, drive-lock-verifier, bundle-acquisition, drive-bootstrap, drive-browser, drive-browser-coverage, drive-release-preflight]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if ! jq -e 'has("drive-browser-coverage") and all(.[]; .result == "success")' <<< "$NEEDS_JSON" > /dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
