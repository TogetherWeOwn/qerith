name: Drive first-release staging smoke

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact lowercase 40-character main commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}

jobs:
  # An invalid dispatch must stay out of the shared staging queue.
  source:
    if: github.repository == 'TogetherWeOwn/qerith' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify protected dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != TogetherWeOwn/qerith ||
                "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            printf '%s\n' 'Invalid first-release smoke dispatch.' >&2
            exit 1
          fi
  smoke:
    needs: source
    if: success() && needs.source.result == 'success'
    concurrency:
      group: drive-staging-lifecycle
      cancel-in-progress: false
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/drive
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Build the exact candidate without provider credentials
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
          test "$(npm --version)" = 11.19.0
          test "$(npm config get min-release-age)" = 3
          test "$(npm config get ignore-scripts)" = true
          npm ci --ignore-scripts --no-audit --no-fund
          DRIVE_BUILD_SHA="$GITHUB_SHA" npm run build
          node_modules/.bin/wrangler deploy .svelte-kit/cloudflare/_worker.js \
            --config wrangler.build.jsonc --dry-run --outdir .svelte-kit/first-release-package
          node scripts/first-release-build-digest.mjs
      - name: Verify disposable bindings, deploy and exercise the private release
        env: &smoke_credentials
          QERITH_FIRST_RELEASE_SMOKE_TARGET: ${{ secrets.QERITH_FIRST_RELEASE_SMOKE_TARGET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.QERITH_FIRST_RELEASE_SMOKE_CLOUDFLARE_TOKEN }}
          QERITH_FIRST_RELEASE_SMOKE_R2_ACCESS_KEY_ID: ${{ secrets.QERITH_FIRST_RELEASE_SMOKE_R2_ACCESS_KEY_ID }}
          QERITH_FIRST_RELEASE_SMOKE_R2_SECRET_ACCESS_KEY: ${{ secrets.QERITH_FIRST_RELEASE_SMOKE_R2_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/first-release-smoke.mjs exercise
      - name: Remove and verify the claimed disposable fixtures
        if: always()
        env: *smoke_credentials
        run: |
          if [[ -e "$RUNNER_TEMP/drive-first-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/claim.json" ]]; then
            node --import tsx scripts/first-release-smoke.mjs cleanup
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: drive-first-release-smoke-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drive-first-release-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: error
          retention-days: 7
