name: drive staging preparation

# Review-only preparation: this workflow cannot deploy or access staging secrets.
# Live deployment requires the prerequisites in docs/drive-staging.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/drive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Verify immutable source and dependency policy
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(npm --version)" = 11.19.0
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare closed-admission metadata
        run: |
          set -euo pipefail
          node --test scripts/staging-manifest.test.mjs
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { preparationManifest } from './scripts/staging-manifest.mjs';
          const manifest = preparationManifest({
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          });
          writeFileSync(`${process.env.RUNNER_TEMP}/drive-staging-preparation.json`,
            `${JSON.stringify(manifest, null, 2)}\n`, { flag: 'wx' });
          NODE
      - name: Upload preparation metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drive-staging-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drive-staging-preparation.json
          if-no-files-found: error
          retention-days: 1
      - name: Build and validate without deployment
        run: |
          set -euo pipefail
          npm run build
          test -s .svelte-kit/cloudflare/_worker.js
          npx --no-install wrangler deploy .svelte-kit/cloudflare/_worker.js --config wrangler.build.jsonc --dry-run --outdir "$RUNNER_TEMP/drive-staging-dry-run"
