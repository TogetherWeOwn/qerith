name: Drive staging source preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparation:
    if: github.repository == 'TogetherWeOwn/qerith' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dispatch source
        shell: bash
        run: |
          # Actions expression comparisons ignore case; this check does not.
          if [[ "$GITHUB_REPOSITORY" != TogetherWeOwn/qerith ||
                "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            printf '%s\n' 'unexpected dispatch source' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'invalid source SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        shell: bash
        run: |
          if ! checkout_sha="$(git rev-parse --verify HEAD)"; then
            printf '%s\n' 'could not resolve checkout HEAD' >&2
            exit 1
          fi
          if [[ "$checkout_sha" != "$GITHUB_SHA" ]]; then
            printf '%s\n' 'checkout SHA mismatch' >&2
            exit 1
          fi
      - name: Record migration source inputs
        run: node apps/drive/scripts/staging-migrations.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Test closed-admission metadata
        run: node --test apps/drive/scripts/staging-manifest.test.mjs

  publish:
    # Live execution requires a separately reviewed enabling change and staging config.
    if: ${{ false }}
    needs: preparation
    # Serializes only jobs using this group; it does not fence external D1 writers.
    concurrency:
      group: drive-staging-d1-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/drive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Verify source and lock
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/reject-shrinkwrap.sh .
          node scripts/verify-lock-age.mjs
          test "$(npm --version)" = 11.19.0
          test "$(npm config get min-release-age)" = 3
          test "$(npm config get ignore-scripts)" = true
      - name: Install and build exact source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Publish built staging Worker
        run: node scripts/staging-publish.mjs
