name: screen-reader bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test input validation
        run: python3 -m unittest discover -s scripts/screen-reader -p test_bundle_inputs.py -v
      - name: Acquire and verify pinned artifacts
        run: |
          set -euo pipefail
          python3 -I scripts/screen-reader/bundle_inputs.py acquire apps/drive/package-lock.json "$RUNNER_TEMP/bundle"
          python3 -I scripts/screen-reader/bundle_inputs.py verify apps/drive/package-lock.json "$RUNNER_TEMP/bundle"
      - name: Seed cache and install frozen dependencies without scripts
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/tool" "$RUNNER_TEMP/cache" "$RUNNER_TEMP/project"
          tar -xJf "$RUNNER_TEMP/bundle/node-v24.21.0-linux-x64.tar.xz" -C "$RUNNER_TEMP/tool"
          export PATH="$RUNNER_TEMP/tool/node-v24.21.0-linux-x64/bin:$PATH"
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          for artifact in "$RUNNER_TEMP/bundle"/*.tgz; do
            npm cache add "$artifact" --offline --ignore-scripts --cache "$RUNNER_TEMP/cache"
          done
          cp apps/drive/package.json apps/drive/package-lock.json "$RUNNER_TEMP/project/"
          npm ci --prefix "$RUNNER_TEMP/project" --offline --ignore-scripts --no-audit --no-fund --min-release-age=3 --cache "$RUNNER_TEMP/cache"
          cmp apps/drive/package-lock.json "$RUNNER_TEMP/project/package-lock.json"
