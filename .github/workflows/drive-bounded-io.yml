name: Drive bounded I/O

on:
  pull_request:
    paths: &drive_io_paths
      - 'apps/drive/src/**'
      - 'apps/drive/vite.config.js'
      - 'apps/drive/scripts/lint-bounded-io*.mjs'
      - 'apps/drive/package*.json'
      - 'apps/drive/.npmrc'
      - '.github/workflows/drive-bounded-io.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths: *drive_io_paths

permissions:
  contents: read

jobs:
  lint:
    name: Drive bounded I/O lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/drive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check the reviewed PR head and the exact candidate on queue events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/lint-bounded-io.test.mjs
      - run: node scripts/lint-bounded-io.mjs
